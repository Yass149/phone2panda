name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install headless graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgl1-mesa-dri
      - name: Install locked environment
        run: make setup
      - name: Lint and test
        run: make lint typecheck test
      - name: Run saved-model simulation
        run: make simulate-demo
      - name: Rebuild public-data priors and check teacher safety
        run: make verify-data phase4e-preflight
      - name: Check results and publication privacy
        run: make submission-check privacy-history
