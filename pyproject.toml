[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "phone2panda"
version = "0.1.0"
description = "Calibrated phone-video motion priors and compact Panda reference tracking"
requires-python = ">=3.11,<3.12"
dependencies = [
  "av==16.0.1",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "matplotlib==3.10.6",
  "mujoco==3.2.7",
  "numpy==2.2.6",
  "opencv-python==5.0.0.93",
  "PyYAML==6.0.2",
  "robosuite==1.5.1",
  "scipy==1.16.3",
]

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.13.2",
]

[project.scripts]
phone2panda-validate-pilots = "phone2panda.pilot_validation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/phone2panda"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["phone2panda"]

[tool.coverage.report]
fail_under = 45
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".cache", ".local", ".tools", ".venv", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90"]

[tool.mypy]
python_version = "3.11"
files = [
  "src/phone2panda/evaluation/safety.py",
  "src/phone2panda/privacy.py",
  "src/phone2panda/provenance.py",
  "src/phone2panda/retarget/mapping.py",
  "src/phone2panda/trajectories/dmp.py",
  "src/phone2panda/trajectories/processing.py",
]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
